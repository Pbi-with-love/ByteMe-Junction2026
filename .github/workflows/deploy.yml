name: deploy
on: workflow_dispatch
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          ssh "${DEPLOY_USER}@${DEPLOY_HOST}" "cd /opt/agent-kitchen && git pull --ff-only && docker compose up -d --build"
      - name: Wait for gateway
        run: |
          for i in $(seq 1 18); do
            curl -fsS https://bytemegaming.tech/.well-known/agent-commerce.json >/dev/null && exit 0
            sleep 5
          done
          echo "gateway not healthy after 90 s"; exit 1
